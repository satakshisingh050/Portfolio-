<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Satakshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="blob-field" aria-hidden="true">
    <span class="blob blob--pink"></span>
    <span class="blob blob--lavender"></span>
    <span class="blob blob--blue"></span>
  </div>

  <section class="hero" style="min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;">
    <div class="hero-content glass-card" style="padding: clamp(36px, 6vw, 60px); text-align: center; max-width: 580px; margin: 0 auto;">
      <p class="hero-intro" style="margin-bottom: 18px;">🌸 All done</p>
      <h1 style="font-size: clamp(38px, 6vw, 56px); margin-bottom: 14px;">Message Sent!</h1>
      <p style="color: var(--muted); margin: 0 auto 32px; font-size: 15px; line-height: 1.7; max-width: 440px;">
        Thank you for reaching out! Your message has been received, and I'll get back to you as soon as possible.
      </p>
      <a href="index.html#home" class="btn btn-primary">Back to Home</a>
    </div>
  </section>

  <script>
    // Maintain theme preference on success page
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  </script>
</body>
</html>
